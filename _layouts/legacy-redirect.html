<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} — {{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.destination | absolute_url }}">
  <meta http-equiv="refresh" content="0; url={{ page.destination | relative_url }}">
</head>
<body>
  <main>
    <h1>{{ page.title | escape }}</h1>
    <p>Continue to <a href="{{ page.destination | relative_url }}">{{ page.destination_title | escape }}</a>.</p>
  </main>
</body>
</html>

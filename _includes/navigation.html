<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Sam Ren — home"><span class="brand-symbol" aria-hidden="true">s<span>r</span><i></i></span><span>Sam Ren<span class="brand-descriptor">Mathematics</span></span></a>
  <nav class="site-nav" id="site-navigation" aria-label="Main navigation">
    {% assign current_url = page.url | remove: 'index.html' %}
    {% for link in site.links %}<a href="{{ link.url | relative_url }}"{% if current_url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>{% endfor %}
  </nav>
  <div class="header-actions">
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode"><span class="theme-sun">{% include icon.html name='sun' %}</span><span class="theme-moon">{% include icon.html name='moon' %}</span></button>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="site-navigation" aria-expanded="false"><span></span><span></span></button>
  </div>
</header>

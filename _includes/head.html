<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#edf1f7" id="theme-color">
{% if site.google_verify %}<meta name="google-site-verification" content="{{ site.google_verify }}">{% endif %}
{% if site.bing_verify %}<meta name="msvalidate.01" content="{{ site.bing_verify }}">{% endif %}
{% capture canonical %}{{ site.url }}{{ page.url | remove: 'index.html' }}{% endcapture %}
<link rel="canonical" href="{{ canonical }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }} — {{ site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ '/images/Xuyi.png' | absolute_url }}">
<link rel="icon" href="{{ '/images/fav.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/fav.png' | relative_url }}">
<script>
  (function () {
    document.documentElement.classList.add('js');
    var preference;
    try { preference = localStorage.getItem('sam-ren-theme'); } catch (error) {}
    var theme = preference === 'light' || preference === 'dark' ? preference :
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
    document.getElementById('theme-color').content = theme === 'dark' ? '#111722' : '#edf1f7';
  }());
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&amp;family=Manrope:wght@400;500;600;650;700;750;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/atlas.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/page-transitions.css' | relative_url }}">
